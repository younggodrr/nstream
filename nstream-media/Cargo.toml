[package]
name = "nstream-media"
version = "0.1.0"
edition = "2021"

[dependencies]
nstream-core = { path = "../nstream-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bytes = "1"
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

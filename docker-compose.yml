version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nstream
      POSTGRES_PASSWORD: nstream
      POSTGRES_DB: nstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nstream-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://nstream:nstream@postgres:5432/nstream
      NSTREAM_AUTH_REQUIRED: "true"
      NSTREAM_BOOTSTRAP_API_KEY: ${NSTREAM_BOOTSTRAP_API_KEY:?set_NSTREAM_BOOTSTRAP_API_KEY}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?set_WEBHOOK_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set_MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set_MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-nstream-media}
      NSTREAM_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      GPU_WORKER_COUNT: ${GPU_WORKER_COUNT:-4}
      API_PORT: 8080
      RUST_LOG: info
      NSTREAM_LIVE_HLS_DIR: /var/lib/nstream/live-hls
    volumes:
      - live_hls_data:/var/lib/nstream/live-hls

  nstream-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["nstream-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://nstream:nstream@postgres:5432/nstream
      NSTREAM_AUTH_REQUIRED: "true"
      NSTREAM_BOOTSTRAP_API_KEY: ${NSTREAM_BOOTSTRAP_API_KEY:?set_NSTREAM_BOOTSTRAP_API_KEY}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?set_WEBHOOK_ENCRYPTION_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set_MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set_MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-nstream-media}
      NSTREAM_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      JOB_WORKER_COUNT: ${JOB_WORKER_COUNT:-2}
      RUST_LOG: info

volumes:
  minio_data:
  postgres_data:
  redis_data:
  live_hls_data:

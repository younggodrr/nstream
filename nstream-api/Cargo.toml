[package]
name = "nstream-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nstream-api"
path = "src/main.rs"

[dependencies]
nstream-core = { path = "../nstream-core" }
nstream-observe = { path = "../nstream-observe" }
nstream-inference = { path = "../nstream-inference" }
nstream-media = { path = "../nstream-media" }
nstream-ingest = { path = "../nstream-ingest" }
prometheus = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
aws-config = "=0.56.1"
aws-sdk-s3 = "=0.34.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

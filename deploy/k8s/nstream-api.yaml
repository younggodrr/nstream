apiVersion: apps/v1
kind: Deployment
metadata:
  name: nstream-api
  labels: { app: nstream-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: nstream-api } }
  template:
    metadata: { labels: { app: nstream-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/your-org/nstream-api:REPLACE_WITH_TAG
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ secretRef: { name: nstream-runtime } }]
          env: [{ name: NSTREAM_LIVE_HLS_DIR, value: /var/lib/nstream/live-hls }]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: live-hls, mountPath: /var/lib/nstream/live-hls }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: live-hls
          persistentVolumeClaim: { claimName: nstream-live-hls }
---
apiVersion: v1
kind: Service
metadata: { name: nstream-api }
spec:
  selector: { app: nstream-api }
  ports: [{ name: http, port: 80, targetPort: http }]
